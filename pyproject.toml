[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contraption-phase1"
version = "0.3.0"
description = "Differentiable probabilistic digital twins for electrical, rigid-body, and optical simulation and inverse rendering"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Phase 1 reference implementation"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
gpu = ["torch>=2.4"]
agents = ["openai>=1.101"]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
contraption = "contraption.cli:main"
contraption-model-validate = "contraption.part_import.model_validation_tool:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
